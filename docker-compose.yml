services:
  users-postgres:
    image: postgres:17.6-alpine3.22
    environment: { POSTGRES_DB: users, POSTGRES_USER: app, POSTGRES_PASSWORD: app }
    ports: ["5433:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app -d users"], interval: 5s, timeout: 3s, retries: 20 }
  orders-postgres:
    image: postgres:17.6-alpine3.22
    environment: { POSTGRES_DB: orders, POSTGRES_USER: app, POSTGRES_PASSWORD: app }
    ports: ["5434:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app -d orders"], interval: 5s, timeout: 3s, retries: 20 }
  notifications-postgres:
    image: postgres:17.6-alpine3.22
    environment: { POSTGRES_DB: notifications, POSTGRES_USER: app, POSTGRES_PASSWORD: app }
    ports: ["5435:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app -d notifications"], interval: 5s, timeout: 3s, retries: 20 }
  users-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path=/migrations", "-database=postgres://app:app@users-postgres:5432/users?sslmode=disable", "up"]
    volumes: ["./migrations/users:/migrations:ro"]
    depends_on: { users-postgres: { condition: service_healthy } }
  orders-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path=/migrations", "-database=postgres://app:app@orders-postgres:5432/orders?sslmode=disable", "up"]
    volumes: ["./migrations/orders:/migrations:ro"]
    depends_on: { orders-postgres: { condition: service_healthy } }
  notifications-migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path=/migrations", "-database=postgres://app:app@notifications-postgres:5432/notifications?sslmode=disable", "up"]
    volumes: ["./migrations/notifications:/migrations:ro"]
    depends_on: { notifications-postgres: { condition: service_healthy } }
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.4
    environment: { ZOOKEEPER_CLIENT_PORT: 2181, ZOOKEEPER_TICK_TIME: 2000 }
    healthcheck: { test: ["CMD-SHELL", "cub zk-ready localhost 2181 30"], interval: 10s, timeout: 5s, retries: 10 }
  kafka:
    image: confluentinc/cp-kafka:7.7.4
    depends_on: { zookeeper: { condition: service_healthy } }
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  redis:
    image: redis:7.4.7-alpine3.21
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  user-service:
    build: { context: ., dockerfile: Dockerfile }
    environment:
      USER_DB_DSN: postgres://app:app@users-postgres:5432/users?sslmode=disable
      JWT_SECRET: "${JWT_SECRET:-development-only-change-me}"
      GRPC_PORT: "50051"
      METRICS_PORT: "8080"
    ports: ["50051:50051", "8081:8080"]
    depends_on: { users-migrate: { condition: service_completed_successfully } }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"], interval: 10s, timeout: 3s, retries: 10 }
  bot-service: &stub
    build: { context: ., dockerfile: Dockerfile.stub }
    environment: { SERVICE_NAME: bot-service }
  user-outbox-worker:
    <<: *stub
    environment: { SERVICE_NAME: user-outbox-worker }
    depends_on: { users-migrate: { condition: service_completed_successfully }, kafka: { condition: service_started } }
  order-service:
    <<: *stub
    environment: { SERVICE_NAME: order-service }
    depends_on: { orders-migrate: { condition: service_completed_successfully } }
  order-outbox-worker:
    <<: *stub
    environment: { SERVICE_NAME: order-outbox-worker }
  notification-service:
    <<: *stub
    environment: { SERVICE_NAME: notification-service }
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:12.1.1
    ports: ["3000:3000"]
    volumes: ["./deploy/grafana/provisioning:/etc/grafana/provisioning:ro"]
