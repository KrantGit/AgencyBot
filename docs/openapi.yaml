  /api/v1/orders: { get: { responses: { '200': { description: Orders } } }, post: { responses: { '201': { description: Created } } } }
  /api/v1/orders/{id}: { get: { responses: { '200': { description: Order } } }, patch: { responses: { '200': { description: Updated } } } }
